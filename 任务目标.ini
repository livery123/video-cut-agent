## 三、整体技术方案

```
视频输入
  ↓
视频信息读取（时长、fps、分辨率）
  ↓
阶段 1：粗采样抽帧（每 2 秒 1 帧，缩放到宽 960）
  ↓
帧间去重（相似帧跳过 OCR）
  ↓
快速模板匹配
  ↓
疑似关键帧 ROI OCR（只扫 UI 区域）
  ↓
单帧状态识别 + 打分
  ↓
时间轴平滑（孤立状态 / 短片段 / 可疑转移）
  ↓
分局边界提取（含兜底结束规则）
  ↓
阶段 2：边界精修抽帧（每个边界 ±15 秒，每 0.5 秒 1 帧）
  ↓
精修 start / end 时间
  ↓
计算置信度
  ↓
返回 JSON 结果
```

**不做切片**：只分析，不导出，无 ffmpeg 切片耗时和存储压力。

