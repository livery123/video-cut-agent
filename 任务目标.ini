## 六、视频状态定义

V1 只分 5 个状态：

```python
class VideoState:
    LOBBY = "LOBBY"        # 大厅 / 房间 / 准备界面
    ROLE = "ROLE"          # 角色揭示 / 身份展示
    PLAYING = "PLAYING"    # 游戏中 / 会议中 / 投票中
    ENDING = "ENDING"      # 胜利 / 失败 / 结算界面
    UNKNOWN = "UNKNOWN"    # 黑屏 / 加载 / 菜单 / 无法判断
```

### 标准一局流程

```
LOBBY → ROLE → PLAYING → ENDING → LOBBY
```

### 允许的异常流程

```
LOBBY → PLAYING → ENDING → LOBBY     # 跳过角色揭示
PLAYING → ENDING → LOBBY             # 录屏从游戏中开始
ROLE → PLAYING → LOBBY               # 跳过结算界面
LOBBY → PLAYING → LOBBY              # 误开又退出（短局，低置信度）
```

---

## 七、抽帧策略

### 1. 阶段 1：粗采样

```
每 2 秒 1 帧，宽 960 等比缩放
1 小时 → 1800 帧
```

```bash
ffmpeg -i input.mp4 -vf fps=0.5,scale=960:-1 -f image2pipe -vcodec mjpeg -
```

**V1 默认内存管道处理，不全量落盘。** 仅 OCR 帧和边界附近帧保存到 `debug/`。

### 2. 阶段 2：边界精修

粗采样定位边界后，对每个 start/end 在 **±15 秒** 窗口内按 **0.5 秒** 重抽，精修边界。

估算额外帧数：每局 2 个边界 × 60 帧/边界 × 5 局 ≈ **600 帧**，耗时增加约 1～2 分钟，边界误差可从 ±2 秒降到 ±0.5 秒。

### 3. 帧间去重

相邻帧若 SSIM 或直方图相似度 > 0.95 且模板命中相同：

- 跳过 OCR
- 沿用上一帧 score 和 state

大厅等待、游戏中静止画面占比高，可显著减少 OCR 调用。

