## 二十一、V1 方案总结

**鹅鸭杀录屏分局时间检测系统 V1**

核心能力：

1. 上传鹅鸭杀录屏
2. 粗采样（2 秒）+ 边界精修（0.5 秒）
3. 模板匹配快速筛选 + ROI OCR 按需触发
4. 帧去重减少无效 OCR
5. 状态机平滑 + 完整分局规则（含兜底）
6. 返回 start/end/duration/confidence/warnings
7. 调试时间轴 API + 评估脚本闭环

V1 最关键的设计取舍：

| 做 | 不做 |
|----|------|
| 两阶段抽帧 | 全片 0.5 秒抽帧 |
| ROI + 按需 OCR | 全量 OCR |
| 规则 + 模板 | 深度学习模型 |
| 短局降置信不丢弃 | 短局直接丢弃 |
| 文件存储 + 评估集 | 一上来就建数据库 |

目标：

- 1 小时视频 **5～10 分钟**处理完
- 边界误差 **3～8 秒**（精修后可达 **±0.5～2 秒**）
- 局数识别准确率 **80%～90%**（基于标注集评估）

V2 演进方向：YOLO UI 检测、帧分类模型、语音辅助、用户手动校正、Webhook 回调、数据库存储。
