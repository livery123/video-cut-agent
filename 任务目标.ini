## 十二、分局边界检测

### 1. 开始时间

优先级：

| 优先级 | 转移 | start_reason |
|--------|------|--------------|
| 1 | LOBBY → ROLE | 大厅进入角色揭示界面 |
| 2 | LOBBY → PLAYING | 大厅进入游戏中 |
| 3 | UNKNOWN → ROLE / PLAYING | 从未知状态进入游戏 |

规则：

```python
if not in_round and not in_cooldown:
    if prev_state == "LOBBY" and curr_state == "ROLE":
        start_time = max(0, curr_time - START_OFFSET)
        in_round = True
    elif prev_state == "LOBBY" and curr_state == "PLAYING":
        start_time = max(0, curr_time - START_OFFSET)
        in_round = True
    elif prev_state == "UNKNOWN" and curr_state in ("ROLE", "PLAYING"):
        start_time = max(0, curr_time - START_OFFSET)
        in_round = True
```

### 2. 结束时间

优先级：

| 优先级 | 条件 | end_reason |
|--------|------|------------|
| 1 | ENDING → LOBBY | 结算界面后返回大厅 |
| 2 | PLAYING → LOBBY | 游戏中直接返回大厅 |
| 3 | ENDING 连续 ≥ 2 帧 | 识别到结算界面（不等 LOBBY） |
| 4 | 视频结束且 in_round | 视频截断，取最后 ENDING 或最后一帧 |

规则：

```python
if in_round:
    if curr_state == "ENDING":
        candidate_end_time = curr_time
        ending_streak += 1
    else:
        ending_streak = 0

    # 确认结束：ENDING → LOBBY
    if prev_state == "ENDING" and curr_state == "LOBBY":
        close_round(end_time=curr_time + END_OFFSET, reason="结算界面后返回大厅")

    # 确认结束：PLAYING → LOBBY
    elif prev_state == "PLAYING" and curr_state == "LOBBY":
        close_round(end_time=curr_time + END_OFFSET, reason="游戏中直接返回大厅")

    # 兜底：ENDING 持续足够帧数
    elif ending_streak >= ENDING_CONFIRM_FRAMES:
        close_round(end_time=curr_time + END_OFFSET, reason="识别到结算界面")

# 视频结束兜底
if in_round at video_end:
    end_time = (candidate_end_time or last_frame_time) + END_OFFSET
    close_round(reason="视频结束于结算或游戏中")
    warnings.append("video_truncated")
```

### 3. 防重复开局

```python
def close_round(...):
    in_round = False
    in_cooldown_until = end_time + ROUND_COOLDOWN  # 默认 30 秒
    rounds.append(...)
```

### 4. 短局 / 长局处理

```python
if duration < MIN_ROUND_DURATION:       # < 2 分钟
    confidence *= 0.5
    warnings.append("duration_too_short")   # 不丢弃，便于用户排查

if duration > MAX_ROUND_DURATION:       # > 35 分钟
    confidence *= 0.6
    warnings.append("duration_too_long")
```

