## 十一、时间轴平滑

原始结果可能有噪声：

```
LOBBY LOBBY ROLE PLAYING PLAYING LOBBY PLAYING PLAYING ENDING LOBBY
                              ↑ 误判
```

### 1. 合并孤立状态

若某状态连续帧数 ≤ `MAX_ISOLATED_FRAMES`（2 帧 = 4 秒）且前后状态相同，合并为前后状态。

```
PLAYING PLAYING LOBBY PLAYING PLAYING  →  PLAYING PLAYING PLAYING PLAYING PLAYING
```

### 2. 合并过短片段

低于 `MIN_STATE_DURATION` 的状态段，合并到前后更可信的状态。

| 状态 | 最短持续时间 | 最少连续帧（2 秒采样） |
|------|-------------|----------------------|
| LOBBY | 4 秒 | 2 帧 |
| ROLE | 2 秒 | 1 帧 |
| PLAYING | 8 秒 | 4 帧 |
| ENDING | 2 秒 | 1 帧 |

### 3. 可疑状态转移处理

| 转移 | 处理方式 |
|------|----------|
| ENDING → PLAYING | 忽略 PLAYING，直到出现 LOBBY |
| ROLE → LOBBY | 中间帧改为 UNKNOWN |
| LOBBY → ENDING | 要求连续 2 帧 ENDING 才确认 |
| 其他 | 正常处理 |

### 4. 合法转移（参考）

```
LOBBY → ROLE / PLAYING
ROLE → PLAYING
PLAYING → ENDING / LOBBY
ENDING → LOBBY
UNKNOWN → 任意
```

