MIN_ROUND_DURATION = 120          # 秒，低于此值降置信度（不丢弃）
MAX_ROUND_DURATION = 2100         # 秒（35 分钟），超过此值降置信度

# 置信度权重
CONF_WEIGHTS = {
    "start": 0.35,
    "end": 0.35,
    "duration": 0.15,
    "continuity": 0.15,
}

# OCR 模糊匹配阈值
