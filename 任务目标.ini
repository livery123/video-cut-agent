## 十五、API 设计

### 约束

```
max_file_size: 2 GB
max_duration: 7200 秒（2 小时）
supported_formats: mp4, mkv, flv
temp_cleanup: 任务完成后 24 小时自动清理 debug/ 帧
```

### 1. 上传并分析

```
POST /api/video/analyze-rounds
Content-Type: multipart/form-data
```

| 参数 | 说明 | 默认 |
|------|------|------|
| file | 视频文件 | 必填 |
| sample_interval | 粗采样间隔（秒） | 2 |
| enable_ocr | 是否 OCR | true |
| enable_refine | 是否边界精修 | true |
| game_type | 游戏类型 | goose_goose_duck |

返回：

```json
{"task_id": "task_20260628_001", "status": "processing"}
```

### 2. 查询进度

```
GET /api/video/analyze-rounds/{task_id}
```

```json
{
  "task_id": "task_20260628_001",
  "status": "processing",
  "progress": 62,
  "current_step": "OCR 识别关键帧",
  "message": "已处理 1120 / 1800 帧"
}
```

进度权重建议：

```
抽帧 20% → 模板 30% → OCR 35% → 状态机 5% → 精修 10%
```

### 3. 获取分局结果

```
GET /api/video/analyze-rounds/{task_id}/result
```

（见第一节输出示例）

### 4. 调试时间轴（分页）

```
GET /api/video/analyze-rounds/{task_id}/timeline?page=1&page_size=100&state=ENDING
```

```json
{
  "total": 1800,
  "page": 1,
  "timeline": [
    {
      "time": "00:00:18",
      "seconds": 18,
      "state": "ROLE",
      "confidence": 0.91,
      "ocr_text": ["你的身份是", "鸭子"],
      "template_hits": ["role_card"],
      "score": {"LOBBY": 0, "ROLE": 9, "PLAYING": 0, "ENDING": 0, "UNKNOWN": 0}
    }
  ]
}
```

用途：排查「00:10:00 为何被识别成 LOBBY」——看 OCR 错、模板误命中还是状态机问题。

### 5. 取消任务

```
DELETE /api/video/analyze-rounds/{task_id}
```

取消后台任务并清理临时 debug 帧。

