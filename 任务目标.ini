## 五、统一配置常量（config.py）

所有阈值集中管理，禁止散落在各模块：

```python
# 抽帧
COARSE_SAMPLE_INTERVAL = 2        # 秒，粗采样间隔
REFINE_SAMPLE_INTERVAL = 0.5      # 秒，精修采样间隔
REFINE_WINDOW = 15                # 秒，边界前后精修窗口
