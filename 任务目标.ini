## 十七、处理耗时预估

| 步骤 | 耗时 |
|------|------|
| 视频信息读取 | 数秒 |
| 粗采样 1800 帧 | 1～3 分钟 |
| 模板匹配 | 1～2 分钟 |
| OCR 疑似帧 200～400 张（ROI + 去重后） | 2～4 分钟 |
| 状态机分析 | 数秒 |
| 边界精修 ~600 帧 | 1～2 分钟 |
| 输出结果 | 数秒 |

**合计：1 小时视频约 5～10 分钟（普通 CPU）**

若全量 OCR 1800 帧：10～30 分钟，**V1 禁止**。

性能保障三原则：

1. 模板先筛选，疑似帧才 OCR
2. OCR 只扫 ROI，不全图
3. 相似帧去重，跳过重复 OCR

可选：模板/OCR 步骤使用 `ProcessPoolExecutor` 并行。

