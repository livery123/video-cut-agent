## 十、单帧状态分类

每帧生成 score 字典，取最高分：

```python
state = max(score, key=score.get)

if score[state] < MIN_STATE_SCORE:  # 默认 3
    state = "UNKNOWN"
```

示例：

```json
{
  "time": "00:10:02",
  "score": {"LOBBY": 0, "ROLE": 0, "PLAYING": 1, "ENDING": 9, "UNKNOWN": 0},
  "state": "ENDING"
}
```

