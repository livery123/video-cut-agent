## 十八、开发顺序

| 步骤 | 内容 | 产出 |
|------|------|------|
| **0** | 准备标注数据集 + 评估脚本 | eval/run_eval.py + 5 段标注视频 |
| **1** | 视频抽帧（粗采样 + 内存管道） | `[{seconds, frame}]` 列表 |
| **2** | 模板匹配（先 3 类：大厅/角色/结算） | template_hits + maybe_state |
| **3** | ROI OCR + 模糊关键词 | ocr_text + score |
| **4** | 单帧状态识别 | 原始时间轴 |
| **5** | 状态机平滑 | 去噪时间轴 |
| **6** | 分局边界提取（含兜底规则） | rounds 列表 |
| **7** | 边界精修抽帧 | 精修后 start/end |
| **8** | 跑评估脚本，对比指标 | precision / recall / 边界误差报告 |

