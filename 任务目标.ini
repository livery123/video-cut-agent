## 十四、置信度设计

### 公式

```python
confidence = (
    start_confidence * 0.35
    + end_confidence  * 0.35
    + duration_score  * 0.15
    + continuity_score * 0.15
)
```

### 1. 开始置信度

| 转移 | 分值 |
|------|------|
| LOBBY → ROLE | 0.95 |
| LOBBY → PLAYING | 0.85 |
| UNKNOWN → ROLE | 0.75 |
| UNKNOWN → PLAYING | 0.65 |

### 2. 结束置信度

| 条件 | 分值 |
|------|------|
| PLAYING → ENDING → LOBBY | 0.95 |
| ENDING 连续 ≥ 2 帧 | 0.88 |
| PLAYING → LOBBY | 0.78 |
| 视频截断兜底 | 0.60 |

### 3. 时长置信度

| 时长 | duration_score |
|------|----------------|
| < 2 分钟 | 0.5 |
| 2～35 分钟 | 1.0 |
| > 35 分钟 | 0.6 |

### 4. 连续性置信度（continuity_score）

一局内 PLAYING 帧占该局总帧数的比例：

```python
continuity_score = playing_frames / total_frames_in_round
# 比例 < 0.3 时额外降权（可能误判边界）
if continuity_score < 0.3:
    continuity_score = 0.5
```

