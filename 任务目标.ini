## 十九、V1 最小规则速查

### 开始

- LOBBY → ROLE：一局开始
- LOBBY → PLAYING：一局开始
- UNKNOWN → ROLE / PLAYING：一局开始

### 结束

- ENDING → LOBBY：确认结束（高置信）
- PLAYING → LOBBY：兜底结束
- ENDING 连续 ≥ 2 帧：确认结束（不等 LOBBY）
- 视频结束且 in_round：兜底结束

### 平滑

- 孤立状态 ≤ 2 帧且前后相同 → 合并
- 过短 PLAYING（< 8 秒）→ 合并
- 过短 LOBBY（< 4 秒）→ 合并
- 可疑转移按第十一节表格处理

### 时长

- < 2 分钟：confidence × 0.5，warning，**不丢弃**
- 2～35 分钟：正常
- > 35 分钟：confidence × 0.6，warning

### 防重复

- 一局结束后 30 秒冷却期内不新开局

