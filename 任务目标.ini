## 二、成功指标与评估

### 指标定义（必须量化，否则无法迭代）

| 指标 | 定义 | V1 目标 |
|------|------|---------|
| 局数召回率 | 检出局数 / 真实局数 | ≥ 85% |
| 局数精确率 | 正确局数 / 检出局数 | ≥ 85% |
| 边界误差 | \|检测时间 - 真实时间\| | start/end 均 ≤ 8 秒 |
| 有效局 IoU | 时间段重叠率 ≥ 0.8 视为正确 | ≥ 80% 的局 IoU 达标 |

### 标注数据集（开发第 0 步，必须先做）

准备 **5～10 段**录屏，每段人工标注真实局边界：

```
eval/
├── video_001.mp4
├── video_001.json    # {"rounds": [{"start": 18, "end": 602}, ...]}
├── video_002.mp4
├── video_002.json
└── ...
```

每改一版规则，运行评估脚本输出：

```
局数精确率: 88%
局数召回率: 92%
平均边界误差: 4.2 秒
低置信度局数: 1
```

