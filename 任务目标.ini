# 分局规则
START_OFFSET = 2                  # 开始时间往前补（秒）
END_OFFSET = 2                    # 结束时间往后补（秒）
ENDING_CONFIRM_FRAMES = 2         # ENDING 连续 N 帧确认结束（不必等 LOBBY）
