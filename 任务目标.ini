## 十三、核心伪代码

```python
def detect_rounds(timeline, video_duration):
    rounds = []
    in_round = False
    in_cooldown_until = 0
    start_time = start_reason = None
    candidate_end_time = None
    ending_streak = 0

    for i in range(1, len(timeline)):
        prev, curr = timeline[i - 1], timeline[i]
        prev_state, curr_state = prev["state"], curr["state"]
        curr_time = curr["time"]

        if curr_time < in_cooldown_until:
            continue

        # ── 开始 ──
        if not in_round:
            if prev_state == "LOBBY" and curr_state == "ROLE":
                start_time = max(0, curr_time - START_OFFSET)
                start_reason = "大厅进入角色揭示界面"
                in_round = True
            elif prev_state == "LOBBY" and curr_state == "PLAYING":
                start_time = max(0, curr_time - START_OFFSET)
                start_reason = "大厅进入游戏中"
                in_round = True
            elif prev_state == "UNKNOWN" and curr_state in ("ROLE", "PLAYING"):
                start_time = max(0, curr_time - START_OFFSET)
                start_reason = "从未知状态进入游戏"
                in_round = True

        # ── 结束 ──
        else:
            if curr_state == "ENDING":
                candidate_end_time = curr_time
                ending_streak += 1
            else:
                ending_streak = 0

            closed = False
            if prev_state == "ENDING" and curr_state == "LOBBY":
                _close("结算界面后返回大厅", curr_time + END_OFFSET)
                closed = True
            elif prev_state == "PLAYING" and curr_state == "LOBBY":
                _close("游戏中直接返回大厅", curr_time + END_OFFSET)
                closed = True
            elif ending_streak >= ENDING_CONFIRM_FRAMES:
                _close("识别到结算界面", curr_time + END_OFFSET)
                closed = True

    # 视频结束兜底
    if in_round:
        end_t = (candidate_end_time or timeline[-1]["time"]) + END_OFFSET
        _close("视频结束于结算或游戏中", end_t, truncated=True)

    return rounds

    def _close(reason, end_time, truncated=False):
        nonlocal in_round, in_cooldown_until, ending_streak
        duration = end_time - start_time
        conf = calc_confidence(start_reason, reason, duration, timeline, start_time, end_time)
        warnings = []
        if duration < MIN_ROUND_DURATION:
            conf *= 0.5
            warnings.append("duration_too_short")
        if duration > MAX_ROUND_DURATION:
            conf *= 0.6
            warnings.append("duration_too_long")
        if truncated:
            warnings.append("video_truncated")
        rounds.append({...})
        in_round = False
        in_cooldown_until = end_time + ROUND_COOLDOWN
        ending_streak = 0
```

