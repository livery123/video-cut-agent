## 二十、前端展示建议

### 结果页（必需）

- 视频名称、时长、识别局数
- 每局：开始/结束/时长/置信度/原因
- 置信度 < 70% 标黄，< 50% 标红
- warnings 展示（如 duration_too_short、video_truncated）

### 交互（V1 低成本）

- 点击某一局 → 视频跳转到对应时间点（`<video>` + `#t=seconds`）
- 「调试时间轴」折叠区，支持按状态筛选（如只看 ENDING）
- 局间 gap 展示（便于发现漏检）

### 调试时间轴示例

```
00:00:00  LOBBY
00:00:18  ROLE
00:00:24  PLAYING
00:09:58  ENDING
00:10:02  LOBBY
00:10:41  ROLE        ← 第 2 局开始
```

