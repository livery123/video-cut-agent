# 鹅鸭杀录屏分局时间检测系统 — V1 任务目标

> 文档版本：V1.1  
> 最后更新：2026-06-28

---

## 零、V1 范围定义

### 做什么

| 项目 | 说明 |
|------|------|
| 输入 | 1 小时鹅鸭杀录屏（mp4 / mkv / flv） |
| 输出 | 每一局的 start_time、end_time、confidence、原因说明 |
| 性能 | 1 小时视频 **10 分钟内**处理完 |
| 精度 | 边界误差目标 **3～8 秒**，局数识别准确率 **80%～90%** |

### 不做什么（V1 明确排除）

- 不自动切片、不导出片段（不调用 `ffmpeg -ss -to`）
- 不全量 OCR（只对疑似关键帧 OCR）
- 不逐帧分析（默认每 2 秒 1 帧粗采样）
- 不上深度学习分类模型（模板 + 规则 + OCR 关键词）

### 核心流程（一句话）

```
抽帧 → 模板匹配 → 按需 OCR → 帧状态识别 → 时间轴平滑 → 分局边界 → 边界精修 → 输出时间段
```

### V1 必做 / V2 可选

| V1 必做 | V2 可选 |
|---------|---------|
| 两阶段抽帧（粗 2s + 边界精修 0.5s） | YOLO UI 检测 |
| 模板匹配 + ROI OCR | 帧状态分类模型 |
| 状态机平滑 + 分局提取 | 语音关键词辅助 |
| 置信度 + 调试时间轴 API | 用户手动校正边界 |
| 评估脚本 + 标注数据集 | 数据库存储 |
| 内存处理为主，按需落盘 debug 帧 | Webhook 回调 |

