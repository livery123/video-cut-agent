## 九、识别逻辑

每张帧按以下顺序处理，避免全量 OCR：

```
1. 帧间去重检查（相似则跳过）
2. 模板匹配
3. 图像规则判断（黑屏、ROLE 后默认 PLAYING 等）
4. 判断是否需要 OCR
5. ROI OCR（只扫 UI 区域）
6. 关键词模糊匹配 + 状态打分
7. 输出当前帧状态
```

### 1. 模板匹配

**V1 模板清单：**

| 模板文件 | 用途 | 加分 |
|----------|------|------|
| start_button.png | 开始游戏按钮 | LOBBY +4 |
| ready_button.png | 准备按钮 | LOBBY +3 |
| role_card.png | 角色揭示界面 | ROLE +4 |
| task_bar.png | 游戏任务栏 | PLAYING +3 |
| meeting_panel.png | 会议/投票面板 | PLAYING +2 |
| victory_text.png | 胜利文字区域 | ENDING +5 |
| return_lobby_button.png | 返回大厅按钮 | ENDING +4 |
| loading_black.png | 加载黑屏 | UNKNOWN +5 |
| countdown.png | 开局倒计时 | ROLE +3, PLAYING +2 |

### 2. OCR 触发条件

满足任一条件才 OCR：

- 模板命中疑似 LOBBY / ROLE / ENDING
- 画面大面积变暗（可能是加载或结算）
- 前后帧状态变化明显
- 当前帧 score 最高项 < MIN_STATE_SCORE（证据不足）

### 3. OCR ROI 区域（960 宽基准）

| 区域 | 坐标（宽×高比例） | 用途 |
|------|-------------------|------|
| bottom | 底部 20% | 开始游戏、返回大厅、准备 |
| center | 中央 40% | 角色揭示、胜利/失败文字 |
| top | 顶部 15% | 任务栏、会议标题 |

不对全图 OCR，速度和准确率均优于全图扫描。

### 4. V1 关键词库（精简版）

V1 只保留高置信关键词，**不包含职业名**（V2 再加）：

```python
KEYWORDS = {
    "LOBBY": ["开始游戏", "准备", "房间", "房间码", "邀请", "玩家"],
    "ROLE": ["你的身份", "你是"],
    "ENDING": ["胜利", "失败", "鹅胜利", "鸭子胜利", "中立胜利", "返回大厅", "继续"],
    "PLAYING": ["任务", "投票", "跳过", "会议", "讨论"],
}
```

OCR 加分规则（模糊匹配，阈值 80）：

```python
if fuzzy_match(text, "开始游戏") or fuzzy_match(text, "准备"):
    score["LOBBY"] += 4

if fuzzy_match(text, "你的身份") or fuzzy_match(text, "你是"):
    score["ROLE"] += 5

if fuzzy_match(text, "胜利") or fuzzy_match(text, "失败"):
    score["ENDING"] += 5

if fuzzy_match(text, "返回大厅"):
    score["ENDING"] += 4

if fuzzy_match(text, "投票") or fuzzy_match(text, "跳过"):
    score["PLAYING"] += 2
```

OCR 容错示例：

```
"返回大厅" → "返回大斤" / "返问大厅"  → fuzzy_match > 80 仍命中
```

### 5. 图像规则补充

```python
# ROLE 之后若无法判断，倾向 PLAYING（减少 ROLE 后 UNKNOWN 导致假边界）
if prev_state == "ROLE" and max_score < MIN_STATE_SCORE:
    score["PLAYING"] += 2

# 大面积黑屏 → UNKNOWN
if dark_ratio > 0.7:
    score["UNKNOWN"] += 5
```

