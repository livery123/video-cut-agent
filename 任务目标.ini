# 帧去重
FRAME_SIMILARITY_THRESHOLD = 0.95 # SSIM/直方图相似度，超过则跳过 OCR

# 单帧状态
MIN_STATE_SCORE = 3               # 低于此分判为 UNKNOWN

# 状态最短持续时间（秒）
MIN_STATE_DURATION = {
