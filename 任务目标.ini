## 十六、数据存储

### V1 推荐：文件 / Redis（轻量）

```
tasks/{task_id}/
├── meta.json          # 任务状态、进度
├── result.json        # 分局结果
└── timeline.json      # 完整时间轴（或分页切片）
```

### V2 可选：数据库

```sql
-- video_analysis_task
CREATE TABLE video_analysis_task (
    id BIGINT PRIMARY KEY AUTO_INCREMENT,
    task_id VARCHAR(64) NOT NULL UNIQUE,
    video_name VARCHAR(255),
    video_path VARCHAR(500),
    duration_seconds INT,
    sample_interval INT DEFAULT 2,
    status VARCHAR(32),
    progress INT DEFAULT 0,
    current_step VARCHAR(255),
    error_message TEXT,
    created_at DATETIME,
    updated_at DATETIME
);

-- video_round_result
CREATE TABLE video_round_result (
    id BIGINT PRIMARY KEY AUTO_INCREMENT,
    task_id VARCHAR(64) NOT NULL,
    round_id INT NOT NULL,
    start_seconds INT NOT NULL,
    end_seconds INT NOT NULL,
    duration_seconds INT NOT NULL,
    confidence DECIMAL(5, 2),
    start_reason VARCHAR(255),
    end_reason VARCHAR(255),
    warnings TEXT,
    created_at DATETIME
);

-- video_frame_timeline（调试阶段存，上线后可只存关键帧）
CREATE TABLE video_frame_timeline (
    id BIGINT PRIMARY KEY AUTO_INCREMENT,
    task_id VARCHAR(64) NOT NULL,
    frame_id INT,
    seconds INT,
    state VARCHAR(32),
    confidence DECIMAL(5, 2),
    ocr_text TEXT,
    template_hits TEXT,
    raw_score TEXT,
    image_path VARCHAR(500),
    created_at DATETIME
);
```

